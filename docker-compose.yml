services:
  learning-demo:
    env_file:
      - .env
    environment:
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-https://t3.storageapi.dev}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-contained-cart-dvzifke-sx}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-auto}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    build:
      context: .
      args:
        VITE_VIDEO_BASE_URL: ${VITE_VIDEO_BASE_URL:-https://t3.storageapi.dev/contained-cart-dvzifke-sx}
        AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-https://t3.storageapi.dev}
        AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-contained-cart-dvzifke-sx}
        AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-auto}
        AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
        AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    ports:
      - "8080:80"
    restart: unless-stopped

